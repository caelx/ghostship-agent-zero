name: Image

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: image-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  TEST_IMAGE: ghostship-agent-zero:test
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-test-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run contract tests
        run: |
          python3 tests/test_cloakbrowser_plugin_install.py
          python3 tests/test_bitwarden_plugin_install.py
          python3 tests/test_provider_plugin_install.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare runner disk space
        run: |
          # The Agent Zero base image is large enough that Docker load has
          # exhausted the default GitHub runner disk on previous builds.
          sudo rm -rf \
            /opt/az \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet
          docker system prune -af
          df -h

      - name: Build amd64 test image
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          platforms: linux/amd64
          load: true
          tags: |
            ${{ env.TEST_IMAGE }}
            ${{ env.REGISTRY_IMAGE }}:amd64-${{ github.sha }}
          cache-from: type=gha,scope=agent-zero-amd64
          cache-to: type=gha,scope=agent-zero-amd64,mode=max

      - name: Run image tests
        run: tests/run-image-tests.sh "${TEST_IMAGE}"

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tested amd64 image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "${REGISTRY_IMAGE}:amd64-${GITHUB_SHA}"

  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare runner disk space
        run: |
          # The Agent Zero base image is large enough that Docker load has
          # exhausted the default GitHub runner disk on previous builds.
          sudo rm -rf \
            /opt/az \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet
          docker system prune -af
          df -h

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.REGISTRY_IMAGE }}:arm64-${{ github.sha }}
          cache-from: type=gha,scope=agent-zero-arm64
          cache-to: type=gha,scope=agent-zero-arm64,mode=max

  publish-manifest:
    runs-on: ubuntu-latest
    needs:
      - build-test-amd64
      - build-arm64
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          docker buildx imagetools create \
            -t "${REGISTRY_IMAGE}:latest" \
            -t "${REGISTRY_IMAGE}:${GITHUB_SHA}" \
            "${REGISTRY_IMAGE}:amd64-${GITHUB_SHA}" \
            "${REGISTRY_IMAGE}:arm64-${GITHUB_SHA}"
