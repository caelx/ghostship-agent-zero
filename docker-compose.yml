services:
  agent-zero:
    container_name: ghostship-agent-zero
    build:
      context: .
    image: ghostship-agent-zero:local
    environment:
      BW_CLIENTID: ${BW_CLIENTID:-}
      BW_CLIENTSECRET: ${BW_CLIENTSECRET:-}
      BW_PASSWORD: ${BW_PASSWORD:-}
    volumes:
      - ./agent-zero:/a0
    ports:
      - "50080:80"
      - "50022:22"
      - "59000-59009:9000-9009"
