services:
  agent-zero:
    container_name: ghostship-agent-zero
    build:
      context: .
    image: ghostship-agent-zero:local
    environment:
      BW_CLIENTID: ${BW_CLIENTID:-}
      BW_CLIENTSECRET: ${BW_CLIENTSECRET:-}
      BW_CLIENT_ID: ${BW_CLIENT_ID:-}
      BW_CLIENT_SECRET: ${BW_CLIENT_SECRET:-}
      BW_PASSWORD: ${BW_PASSWORD:-}
      OLLAMA_CLOUD_API_KEY: ${OLLAMA_CLOUD_API_KEY:-}
      OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:-}
      NVIDIA_BUILD_FREE_API_KEY: ${NVIDIA_BUILD_FREE_API_KEY:-}
      OPENCODE_ZEN_FREE_API_KEY: ${OPENCODE_ZEN_FREE_API_KEY:-}
      OPENROUTER_FREE_API_KEY: ${OPENROUTER_FREE_API_KEY:-}
    volumes:
      - a0_usr:/a0/usr
      - a0_root:/root
    ports:
      - "50080:80"
    shm_size: 2g

volumes:
  a0_usr:
  a0_root:
