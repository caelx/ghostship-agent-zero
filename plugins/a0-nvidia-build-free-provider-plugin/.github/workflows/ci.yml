name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv run --with pytest --with httpx python -m pytest -s tests/unit

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - run: bash ci/run_agent_zero_integration.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: provider-integration-artifacts
          path: artifacts/

  live-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Validate NVIDIA catalog is current
        if: github.event_name == 'pull_request'
        env:
          NVIDIA_BUILD_FREE_API_KEY: ${{ secrets.NVIDIA_BUILD_FREE_API_KEY }}
        run: uv run --with httpx python ci/update_validated_catalog.py --check
      - name: Probe NVIDIA catalog for main
        if: github.event_name != 'pull_request'
        env:
          NVIDIA_BUILD_FREE_API_KEY: ${{ secrets.NVIDIA_BUILD_FREE_API_KEY }}
        run: uv run --with httpx python ci/update_validated_catalog.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nvidia-catalog-artifacts
          path: artifacts/
