[project]
name = "a0-openrouter-free-provider-plugin"
version = "1.0.3"
description = "Adds free tool-capable OpenRouter chat models."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
